# Default resource limits for bifrost pods
apiVersion: v1
kind: LimitRange
metadata:
  name: bifrost-limits
  namespace: bifrost
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
      type: Container
    - max:
        cpu: "4"
        memory: "4Gi"
      min:
        cpu: "50m"
        memory: "128Mi"
      type: Container
