# Example ingress for bifrost-docs
# Note: ingress controller runs in bifrost-platform namespace
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bifrost-docs
  namespace: bifrost-docs
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
    - host: docs.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: bifrost-docs-api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bifrost-docs-client
                port:
                  number: 80
  tls:
    - hosts:
        - docs.example.com
      secretName: bifrost-docs-tls
