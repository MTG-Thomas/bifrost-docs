# Resource quotas for bifrost-docs namespace
# Prevents one app from starving the cluster
apiVersion: v1
kind: ResourceQuota
metadata:
  name: bifrost-docs-quota
  namespace: bifrost-docs
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    persistentvolumeclaims: "10"
    services: "10"
    secrets: "20"
    configmaps: "20"
