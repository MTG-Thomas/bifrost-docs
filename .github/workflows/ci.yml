name: CI - Test & Build

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch: # Allow manual triggers

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: mtg-thomas/bifrost-docs-api
  CLIENT_IMAGE_NAME: mtg-thomas/bifrost-docs-client
  AZURE_NEON_PROOF_CLIENT_ID: 8b0fa37b-e02c-425e-8db7-a8494fbbc6fd
  AZURE_NEON_PROOF_TENANT_ID: a3599b15-c39c-4b41-a219-7e24dd5b5190
  AZURE_NEON_PROOF_SUBSCRIPTION_ID: a1d63b24-1202-4bfa-9086-cf32d1d352fc
  AZURE_NEON_PROOF_RESOURCE_GROUP: rg-bifrost-docs-neon-dev
  AZURE_NEON_PROOF_CONTAINER_APP: ca-bifrost-docs-api-neon-dev
  AZURE_NEON_PROOF_API_URL: https://ca-bifrost-docs-api-neon-dev.icymoss-8e8097f1.eastus.azurecontainerapps.io

jobs:
  # =============================================================================
  # Backend Tests & Linting
  # =============================================================================
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bifrost_docs
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: bifrost_docs_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './api/pyproject.toml'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff linter
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run Pyright type checker
        run: pyright src

      - name: Run pytest (unit tests)
        env:
          BIFROST_DOCS_SECRET_KEY: test-secret-key-must-be-at-least-32-characters-long
          BIFROST_DOCS_DATABASE_URL: postgresql+asyncpg://bifrost_docs:testpassword@localhost:5432/bifrost_docs_test
          BIFROST_DOCS_DATABASE_URL_SYNC: postgresql://bifrost_docs:testpassword@localhost:5432/bifrost_docs_test
          BIFROST_DOCS_REDIS_URL: redis://localhost:6379/0
          BIFROST_DOCS_ENVIRONMENT: testing
        run: |
          pytest tests/unit -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          files: ./api/coverage.xml
          flags: backend
          name: backend-coverage

  # =============================================================================
  # Frontend Tests & Linting
  # =============================================================================
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npm run tsc

      - name: Run ESLint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          NODE_ENV: production

  # =============================================================================
  # Proof Deployment - Azure Static Web Apps
  # =============================================================================
  deploy-swa-proof:
    runs-on: ubuntu-latest
    needs: frontend-checks
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Build proof bundle
        working-directory: ./client
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_URL: https://ca-bifrost-docs-api-neon-dev.icymoss-8e8097f1.eastus.azurecontainerapps.io

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BIFROST_DOCS_NEON_DEV }}
          action: upload
          app_location: client/dist
          skip_app_build: true
          skip_api_build: true

  # =============================================================================
  # Build & Push Docker Images
  # =============================================================================
  build-images:
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for API
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=sha,prefix=,suffix=,format=long
            type=ref,event=branch
            latest

      - name: Extract metadata for Client
        id: client-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=sha,prefix=,suffix=,format=long
            type=ref,event=branch
            latest

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          sbom: true
          provenance: true

      - name: Build and push Client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          tags: ${{ steps.client-meta.outputs.tags }}
          labels: ${{ steps.client-meta.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client
          sbom: true
          provenance: true

  # =============================================================================
  # Proof Deployment - Azure Container Apps API
  # =============================================================================
  deploy-api-proof:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'workflow_dispatch'
    environment: azure-neon-proof

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve proof image
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          IMAGE="${REGISTRY}/${API_IMAGE_NAME}:${IMAGE_TAG}"
          echo "tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${IMAGE}"

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_NEON_PROOF_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_NEON_PROOF_TENANT_ID }}
          subscription-id: ${{ env.AZURE_NEON_PROOF_SUBSCRIPTION_ID }}

      - name: Deploy API image to Azure Container Apps
        run: |
          az containerapp update \
            --resource-group "${AZURE_NEON_PROOF_RESOURCE_GROUP}" \
            --name "${AZURE_NEON_PROOF_CONTAINER_APP}" \
            --image "${{ steps.image.outputs.image }}"

      - name: Verify API health
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error "${AZURE_NEON_PROOF_API_URL}/health"; then
              echo
              echo "API health check passed on attempt ${attempt}."
              exit 0
            fi
            echo "API health check attempt ${attempt} failed; waiting..."
            sleep 10
          done

          echo "API health check did not pass within the rollout window." >&2
          exit 1

  # =============================================================================
  # E2E Smoke Tests (Run after images are built)
  # =============================================================================
  e2e-smoke:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Smoke coverage is being stabilized before it becomes deploy-blocking.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate smoke suite inventory
        run: |
          test -f client/e2e/tests/auth.smoke.spec.ts
          test -f client/e2e/tests/navigation.smoke.spec.ts
          test -f client/e2e/tests/passwords.smoke.spec.ts
          echo "Smoke specs are present. Promote this job to runtime execution once fixtures are stable."

  # =============================================================================
  # Full E2E Tests (non-blocking while fixtures are stabilized)
  # =============================================================================
  e2e-tests:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Historical integration coverage is useful signal, but currently has
    # broad fixture drift. Do not block test-VM promotion on this suite.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-buildx-action@v3

      - name: Pull and run full E2E tests
        env:
          BIFROST_DOCS_SECRET_KEY: test-secret-key-must-be-at-least-32-characters-long
          POSTGRES_PASSWORD: testpassword
          GARAGE_ACCESS_KEY_ID: testkey123456789012345678901
          GARAGE_SECRET_ACCESS_KEY: testsecret123456789012345678901234567890123456789
          GARAGE_ADMIN_TOKEN: testadmintoken1234567890123456789012345678901234567890
        run: |
          IMAGE_TAG="$(git rev-parse --short=7 HEAD)"
          docker pull ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${IMAGE_TAG}
          docker pull ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE_NAME }}:${IMAGE_TAG}

          docker tag ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${IMAGE_TAG} jackmusick/bifrost-docs-api:latest
          docker tag ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE_NAME }}:${IMAGE_TAG} jackmusick/bifrost-docs-client:latest

          docker compose -f docker-compose.yml -f docker-compose.test.yml run --rm test-runner

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30

  # =============================================================================
  # Security Scanning
  # =============================================================================
  trivy-repo-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy repository scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-repo-results.sarif'

      - name: Upload Trivy repository scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-repo-results.sarif'
          category: 'repo'

  security-scan:
    runs-on: ubuntu-latest
    needs: build-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner on API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          vuln-type: 'os,library'
          scanners: 'vuln'
          format: 'sarif'
          output: 'trivy-api-results.sarif'

      - name: Run Trivy vulnerability scanner on Client
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE_NAME }}:${{ github.sha }}
          vuln-type: 'os,library'
          scanners: 'vuln'
          format: 'sarif'
          output: 'trivy-client-results.sarif'
          skip-setup-trivy: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-api-results.sarif'
          category: 'api-image'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-client-results.sarif'
          category: 'client-image'

      - name: Gate API image on fixed high/critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ github.sha }}
          vuln-type: 'os,library'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          skip-setup-trivy: true

      - name: Gate Client image on fixed high/critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.CLIENT_IMAGE_NAME }}:${{ github.sha }}
          vuln-type: 'os,library'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          skip-setup-trivy: true
