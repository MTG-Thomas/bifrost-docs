name: SonarQube

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip when SONAR_TOKEN is not configured
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN is not configured; skipping SonarQube scan."

      - name: Set up Python for migration-tool coverage
        if: env.SONAR_TOKEN != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './tools/itglue-migrate/pyproject.toml'

      - name: Generate migration-tool coverage
        if: env.SONAR_TOKEN != ''
        working-directory: ./tools/itglue-migrate
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/unit --cov=src --cov-report=xml:coverage.xml --cov-report=term

      - name: Run SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

