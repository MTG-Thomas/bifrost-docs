title = "bifrost-gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Known fake test/dev values only"
paths = [
  '''api/tests/.*''',
  '''client/e2e/setup/.*''',
  '''client/playwright-report/.*''',
  '''client/test-results/.*''',
  '''\.migration-runs/.*''',
  '''\.env\.test\.example''',
]
regexes = [
  '''dev-secret-key-change-in-production-must-be-32-chars''',
  '''bifrost_dev''',
  '''bifrost123''',
  '''s3_key''',
  '''REPLACE_WITH_32_CHAR_SECRET_KEY''',
]
