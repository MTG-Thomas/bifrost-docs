version: '3.8'

# SSL/TLS Configuration for dev.docs.midtowntg.com
# This file adds HTTPS support using Let's Encrypt certificates

services:
  # Client with SSL support
  client:
    ports:
      - "443:443"  # HTTPS port
    volumes:
      # Mount SSL certificates from host
      - /etc/letsencrypt/live/dev.docs.midtowntg.com/fullchain.pem:/etc/nginx/ssl/cert.pem:ro
      - /etc/letsencrypt/live/dev.docs.midtowntg.com/privkey.pem:/etc/nginx/ssl/key.pem:ro
      # Mount SSL nginx config
      - ./client/nginx-ssl.conf:/app/nginx-ssl.conf:ro
    # Override command to use SSL nginx config
    command: >
      sh -c "if [ -f /etc/nginx/ssl/cert.pem ]; then
               echo 'Using SSL configuration';
               cp /app/nginx-ssl.conf /etc/nginx/conf.d/default.conf;
             else
               echo 'SSL certificates not found, using HTTP';
             fi;
             nginx -g 'daemon off;'"

  # Optional: Auto-renewal service for certificates
  certbot-renew:
    image: certbot/certbot:latest
    container_name: bifrost-docs-certbot-renew
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ~/.secrets/certbot:/secrets:ro
    entrypoint: >
      sh -c "echo '0 0,12 * * * certbot renew --quiet --dns-cloudflare --dns-cloudflare-credentials /secrets/cloudflare.ini' | crontab - && crond -f"
    restart: unless-stopped
    profiles:
      - ssl-renewal  # Only start when explicitly requested
